<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover：让页面铺满刘海屏，安全区再通过 env(safe-area-inset-*)
      单独让开（否则顶部会被状态栏/刘海压住）。
      maximum-scale/user-scalable=no：编辑器是应用型界面，双指缩放会与
      「调整字体大小」和抽屉手势互相干扰，这里保持固定缩放。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EPUB Simple Editor - 专业电子书制作工具</title>
    <!--
      主题预设：必须在首屏绘制前同步执行，避免「先闪浅色再变深色」。
      取不到用户选择时跟随系统；取得到就跟随用户（localStorage: epub-simple-editor-theme）。
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('epub-simple-editor-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || stored === 'light' ? stored === 'dark' : prefersDark;
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          // 声明 color-scheme 有两个作用：
          //   1. 让原生控件（滚动条、表单、以及 title 悬浮提示）跟随主题，
          //      否则系统深色模式下原生提示会变成看不清的黑框；
          //   2. 让浏览器知道本页自己处理了深色，不再强制反色（force-dark）。
          root.style.colorScheme = isDark ? 'dark' : 'light';
          // 3. 地址栏 / 安装后窗口标题栏的颜色也跟着走（与 useTheme 里的
          //    syncThemeColor 保持同一套取值）。
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0a0a0a' : '#f5f5f5');
        } catch (e) {}
      })();
    </script>
    <!--
      Tailwind 改为构建期编译（配置见 tailwind.config.cjs，入口 index.css）。
      原先走 cdn.tailwindcss.com：样式要在浏览器里现算，首次打开多一次外部请求，
      离线时整个界面会掉样式 —— 与 PWA 的离线可用目标冲突。
    -->
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!--
      浏览器地址栏 / 状态栏 / 安装后的窗口标题栏颜色。
      只有一个标签、由下面的首屏脚本和 useTheme 同步改写：本应用允许用户
      显式覆盖系统偏好，用 media 查询写死两档会在「系统浅色 + 用户选深色」时对不上。
    -->
    <meta name="theme-color" content="#f5f5f5" />
    <meta name="application-name" content="EPUB Simple Editor" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EPUB 编辑器" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="在线制作 EPUB 电子书：多书管理、富文本编辑、封面设计与 EPUB 3 导出，数据保存在本机，支持离线使用。" />
    <style>
      /* 未启用脚本时的兜底，同时确保首屏就声明了 color-scheme */
      html { color-scheme: light; }
      html.dark { color-scheme: dark; }

      /* 自定义滚动条 */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #c4c4c4; 
        border-radius: 20px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a3a3a3; 
        background-clip: content-box;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #454545;
        background-clip: content-box;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #5c5c5c;
        background-clip: content-box;
      }
      
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /*
        移动端视口高度。
        100vh 在手机上等于「地址栏收起时」的高度，地址栏一出现就会把底部
        控件（编辑器状态栏、自动保存胶囊）顶出屏幕。dvh 跟随实际可视高度，
        这里覆盖 Tailwind 的 .h-screen，并保留 100vh 作为老浏览器兜底。
      */
      html, body { height: 100%; }
      body { overscroll-behavior: none; }
      /*
        选择器写成 html .h-screen（而不是 .h-screen）：Tailwind 的 CDN 版本
        在运行时才注入样式表，位置在本段之后，同特异度会盖掉这里的规则。
        加一层 html 提高特异度，才能稳定生效。
      */
      @supports (height: 100dvh) {
        html .h-screen { height: 100dvh; }
      }

      /* 触摸操作不需要点击高亮，也不需要 300ms 后的灰色方框 */
      * { -webkit-tap-highlight-color: transparent; }

      /*
        刘海屏 / 手势条安全区。
        env() 在无刘海设备上取 0，因此可以无条件套用。
        顶栏与底栏用 min-height 而不是固定高度，避免 safe-area 把内容压扁。
      */
      .pad-safe-top { padding-top: env(safe-area-inset-top, 0px); }
      .pad-safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pad-safe-x {
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      /*
        触摸设备没有「悬停」这个状态。目录行、文件树、图片上的操作按钮平时
        是 opacity-0、靠 group-hover 才现身的，在手机上就永远点不到。
        这里统一给它们加 .hover-reveal，无悬停设备上强制常显。
      */
      @media (hover: none) {
        .hover-reveal { opacity: 1 !important; }
      }

      /*
        深色主题下的书写纸张。
        书稿自身的主题 CSS 会通过 `.editor-paper { … }` 设置纸张底色与文字颜色
        （见 utils/cssScoper.ts），在深色模式下若不覆盖，就会出现
        「深色外壳 + 刺眼白纸」或「深底配深字」两种读不了的情况。
        这里用 `html.dark` 提高特异性，稳定盖过书稿主题的 `.editor-paper` 规则。
        注意：这只影响编辑区的书写面；「样式主题」里的预览 iframe 仍按书稿原样渲染，
        所以在深色模式下依然能看到真实的排版效果。
      */
      html.dark .editor-paper {
        background-color: #171717;
        color: #e5e5e5;
      }

      /*
        深色下各级标题统一跟随纸张文字色。
        各主题的 h1 / h2 都是照着「白纸」写的，常见做法是直接给标题写死一个深色
        （minimal 的一级标题是纯黑，epic / elegant / ancient 是深棕或深紫，
        fresh 是深蓝）。这些颜色落在深色纸张上，轻则发闷、重则读不清；
        而二级标题常常没写 color、继承纸张文字色而显示为白，
        于是出现「一级标题黑、二级标题白」的割裂。
        这里把一到六级标题统一到纸张文字色，深浅一致。
        与上面一样，只影响编辑区的书写面；导出的 EPUB 与「样式主题」预览
        仍按主题原样渲染。
      */
      html.dark .editor-paper h1,
      html.dark .editor-paper h2,
      html.dark .editor-paper h3,
      html.dark .editor-paper h4,
      html.dark .editor-paper h5,
      html.dark .editor-paper h6 {
        color: #e5e5e5;
      }

      /*
        深色下行内文字同样跟随纸张文字色。
        标题之外，各主题还给行内元素写死了深色：加粗在 classic / minimal 里是纯黑
        (#000)，其余主题是深蓝 / 深棕 / 深紫；斜体、删除线同理。这些颜色落在深色
        纸张上会发闷甚至读不清——加粗正文「看着像没变色」正是这个问题。
        图注 .caption、目录链接 .toc-link 也各写死了一个中灰 / 深色，一并拉回来。
        注意：行内元素上写在元素自身的 color 不会被继承覆盖，必须像标题一样显式
        用 html.dark 提高特异性盖过书稿主题的 `.editor-paper strong` 规则。
        局限：内容若自带行内样式（如 <strong style="color:#000">），其优先级高于
        任何选择器，这里覆盖不到——与上面标题的处理是同一限制。
      */
      html.dark .editor-paper strong,
      html.dark .editor-paper b,
      html.dark .editor-paper em,
      html.dark .editor-paper i,
      html.dark .editor-paper s,
      html.dark .editor-paper strike,
      html.dark .editor-paper del,
      html.dark .editor-paper code,
      html.dark .editor-paper .caption,
      html.dark .editor-paper .toc-link,
      html.dark .editor-paper .toc-level-2 {
        color: #e5e5e5;
      }
      /* 链接保留彩色强调的做法需要逐主题配浅色版，代价高；统一跟随纸张文字色，
         靠下划线来区分链接身份（浅色主题下也是这样识别的）。 */
      html.dark .editor-paper a {
        color: #e5e5e5;
        border-bottom-color: rgba(255, 255, 255, 0.35);
      }
      html.dark .editor-paper a:hover {
        color: #ffffff;
        border-bottom-color: rgba(255, 255, 255, 0.6);
      }
      /* minimal 给下划线写了 #999，深底上几乎看不见，改成半透明白 */
      html.dark .editor-paper u {
        text-decoration-color: rgba(255, 255, 255, 0.4);
      }

      /*
        深色下，书稿里「浅底抠色」的元素都要改成深色纸张色。
        各主题的分割线装饰用 `background:#fff`（或自身浅纸色）在线上挖出断口，
        块引用 / 目录链接也带浅底（如 classic 的 blockquote #fafafa、fresh 的 .toc-link #fff）。
        这些在深色纸张上会露成刺眼的白块。

        为什么覆盖写在编辑区这一层，而不是直接改 themes/*.ts：
        同一份主题 CSS 也用于导出 EPUB，读者的阅读器通常是白纸，那边的 `#fff`
        是正确行为。改了主题文件会连导出结果一起改坏。
      */
      html.dark .editor-paper hr:after,
      html.dark .editor-paper .divider-1:after,
      html.dark .editor-paper .divider-2:after,
      html.dark .editor-paper .divider-3:after,
      html.dark .editor-paper .divider-4:after,
      html.dark .editor-paper .divider-5:after {
        background: #171717;
        background-color: #171717;
        /* 装饰字形各写死了一档深灰（#555~#888），深底上几乎看不见，统一提亮 */
        color: #a3a3a3;
      }
      html.dark .editor-paper blockquote,
      html.dark .editor-paper .toc-link,
      html.dark .editor-paper .toc-level-2 .toc-link {
        background-color: rgba(255, 255, 255, 0.06);
      }
      /*
        块引用的文字色此前漏改：上面只换了它的底色，各主题写死的深色文字
        （classic、fresh、dreamy、pudding 都各配了一档深色）
        在深色胶囊底上依然读不清。
      */
      html.dark .editor-paper blockquote {
        color: #e5e5e5;
      }
      /*
        pudding 的 code 是「白底 + 主题色文字」的胶囊（background:#fff），
        深色纸张上会露成刺眼白块——与上面分割线装饰同理。
        底色换成半透明白，主题色文字保持可读。
      */
      html.dark .editor-paper code {
        background-color: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.16);
      }
      /*
        图注说明文字。utils/cssScoper.ts 注入的 .editor-paper p.caption 写死了一个
        中灰值（特异度 0,2,1，高于各主题自己的 .editor-paper .caption），
        深底上对比偏低，这里压到一档更亮的灰。
      */
      html.dark .editor-paper p.caption {
        color: #a3a3a3;
      }
      /* 图片的「相框」底色/描边同样改成半透明白，保留装帧感又不刺眼 */
      html.dark .editor-paper img {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.16);
      }

      /* 背景装饰网格 */
      .pattern-grid {
        background-image: radial-gradient(#e5e5e5 1px, transparent 1px);
        background-size: 24px 24px;
      }
      html.dark .pattern-grid {
        background-image: radial-gradient(#333333 1px, transparent 1px);
      }
    </style>
    <!--
      manifest 由 vite-plugin-pwa 在构建时注入（含 start_url / scope 与 base 对齐），
      这里不再手写，避免两处路径各改一次。
    -->
  </head>
  <body class="bg-[#F5F5F5] text-gray-900 dark:bg-gray-950 dark:text-gray-100 h-screen overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
